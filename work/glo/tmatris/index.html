<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TMAtris</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Canvas fills the page; the game keeps its own aspect via the engine. */
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      /* Minimal centered loading bar — no Unity logo/branding. */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 240px;
        text-align: center;
      }
      #unity-loading-title {
        color: #fff;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 12px;
        opacity: 0.85;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #33ccff;
        border-radius: 3px;
        transition: width 0.1s ease-out;
      }
      /* Subtle, brand-neutral fullscreen toggle (no Unity sprite). */
      #unity-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        opacity: 0.5;
        border: 2px solid #fff;
        border-radius: 4px;
        background: transparent;
        display: none;
      }
      #unity-fullscreen-button:hover { opacity: 1; }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(200, 0, 0, 0.9);
        padding: 10px 14px;
        border-radius: 6px;
        max-width: 80%;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">TMAtris</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <button id="unity-fullscreen-button" title="Fullscreen"></button>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = "block";
        if (type === "error") warningBanner.style.background = "rgba(200,0,0,0.9)";
        else if (type === "warning") warningBanner.style.background = "rgba(180,120,0,0.9)";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TMAtris",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.style.display = "block";
          fullscreenButton.onclick = () => { unityInstance.SetFullscreen(1); };
        }).catch((message) => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
